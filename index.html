<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>UTAD Run</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <script type="importmap">

        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
