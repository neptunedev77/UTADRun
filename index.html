<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>UTAD Run</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Garantir suporte a importmaps -->
  <script async src="https://unpkg.com/es-module-shims@2.0.10/dist/es-module-shims.js"></script>

  <!-- Importmap: define os módulos externos -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js",
        "FBXLoader": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/loaders/FBXLoader.js",
        "PointerLockControls": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/controls/PointerLockControls.js",
        "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
  <div id="speed" class="speed">Velocidade: 1.0x</div>
  <div id="cameraHint" class="camera-hint">Atalhos: [K] Vista Inicial | [L] Vista Aérea</div>
  <!-- Entrypoint -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
