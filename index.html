<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>UTAD Run</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
  <link rel="stylesheet" href="./style.css" />
  <style>
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    #loadingScreen h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    #loadingScreen p {
      font-size: 1.5em;
      color: #ccc;
    }
    #loadingScreen button {
      background: #fff;
      color: #222;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      font-size: 1.2em;
      padding: 12px 0;
      flex: 1;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #loadingScreen button:hover, #loadingScreen button:focus {
      background: #e0e0e0;
      color: #111;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <h1>UTAD RUN</h1>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 0; margin-bottom: 24px; width: 100%; max-width: 340px;">
      <div id="loginArea" style="display: flex; gap: 20px; width: 100%; justify-content: space-between; align-items: center;">
        <button id="leaderboardBtn" style="flex:1; font-size: 1.2em; padding: 12px 0;">Leaderboard</button>
        <button id="loginBtn" style="flex:1; font-size: 1.2em; padding: 12px 0;">
          <span style="display: flex; align-items: center;">

            <span>Login</span>
          </span>
        </button>
      </div>
      <div style="display: flex; align-items: center; width: 100%; margin: 18px 0 0 0;">
        <hr style="flex:1; border:none; border-top:2px solid #444; margin:0 12px 0 0;"> 
        <span style="font-size: 1.1em; color: #bbb; font-weight: bold; letter-spacing: 1px;">ou</span>
        <hr style="flex:1; border:none; border-top:2px solid #444; margin:0 0 0 12px;">
      </div>
    </div>
    <p style="margin-top: 0; font-size: 1.3em; color: #ccc; text-align: center;">Pressione uma tecla para começar</p>
  </div>
  <script async src="https://unpkg.com/es-module-shims@2.0.10/dist/es-module-shims.js"></script>

</html>
